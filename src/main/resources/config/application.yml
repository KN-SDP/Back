spring:
  profiles:
    # 기본값으로 local 프로필을 사용하도록 설정합니다.
    # 아무런 프로필도 지정하지 않으면 이 설정이 사용됩니다.
    default: local
    group:
      # 'local' 프로필을 활성화하면 'common' 프로필도 함께 활성화됩니다.
      local: common
      # 'prod' 프로필을 활성화하면 'common' 프로필도 함께 활성화됩니다.
      prod: common

server:
  port: 8080
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs