  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info   # health, info 엔드포인트만 외부 노출
  endpoint:
    health:
      show-details: when_authorized   # 인증된 사용자만 DB 상태 같은 세부정보 확인 가능
