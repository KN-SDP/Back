# 이 파일은 오직 테스트 환경에서만 사용됩니다.
spring:
  datasource:
    # H2 DB를 메모리 모드로 사용합니다. 테스트가 끝나면 데이터는 사라집니다.
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 테스트 시작 시 테이블을 생성하고, 끝나면 삭제합니다.
      ddl-auto: create-drop
    properties:
      # H2 DB는 MySQL과 문법이 약간 다르므로, H2에 맞는 문법을 사용하도록 설정합니다.
      hibernate.dialect: org.hibernate.dialect.H2Dialect

# 테스트 환경에서는 실제 암호화 키가 필요 없습니다.
# NullPointerException만 피할 수 있도록 아무 값이나 넣어줍니다.
crypto:
  secret-key: 'test-secret-key-1234567890123456'
  init-vector: 'test-init-vector'